<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Mi Plan Financiero — Control de gastos, presupuesto y ahorro para tu casa" />

  <!-- PWA -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Plan" />

  <!-- Fonts & icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <title>Mi Plan Financiero</title>

  <!-- Applies the saved theme before the app renders. Without this the
       page paints light first and flashes to dark once React mounts,
       since the stylesheet's default palette is the light one. Falls
       back to the OS preference when nothing was ever chosen. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('fp_theme')
        var dark = saved === 'dark' || (saved !== 'light' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        var size = localStorage.getItem('fp_textsize')
        if (size) document.documentElement.setAttribute('data-textsize', size)
      } catch (e) { /* private mode / storage blocked: stay on light */ }
    })()
  </script>
</head>
<body>
  <noscript>Necesitas activar JavaScript para usar esta aplicación.</noscript>
  <div id="root"></div>
</body>
</html>
